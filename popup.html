<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek 翻译</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    width: 240px;
    padding: 14px;
    color: #0f1419;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .row label {
    font-size: 13px;
  }
  #warn {
    font-size: 12px;
    color: #f4212e;
    margin-bottom: 10px;
    display: none;
  }
  button {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    border: none;
    background: #eff3f4;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>DeepSeek 翻译 for X</h1>
  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled">在推特上启用</label>
  </div>
  <div id="warn">还没有设置 API Key</div>
  <button id="openOptions">打开完整设置</button>
  <script src="popup.js"></script>
</body>
</html>
