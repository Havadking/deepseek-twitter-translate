<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek 翻译 - 设置</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    width: 400px;
    padding: 20px;
    color: #0f1419;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 16px;
  }
  h2 {
    font-size: 13px;
    margin: 20px 0 0;
    padding-top: 14px;
    border-top: 1px solid #eff3f4;
    color: #536471;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 14px 0 4px;
  }
  input[type="text"],
  input[type="password"],
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 14px;
    border: 1px solid #cfd9de;
    border-radius: 6px;
  }
  code { font-family: Consolas, monospace; font-size: 12px; background: #eff3f4; padding: 1px 4px; border-radius: 4px; }
  .hint {
    font-size: 12px;
    color: #536471;
    margin-top: 4px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 4px;
  }
  .row label {
    margin: 0;
    font-weight: 400;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  button {
    flex: 1;
    padding: 9px 12px;
    font-size: 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  #save {
    background: #1d9bf0;
    color: #fff;
  }
  #test {
    background: #eff3f4;
    color: #0f1419;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    min-height: 16px;
    white-space: pre-wrap;
  }
  #status.ok { color: #00ba7c; }
  #status.err { color: #f4212e; }
</style>
</head>
<body>
  <h1>DeepSeek 翻译 for X / Twitter</h1>

  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled">在推特页面上显示 DeepSeek 按钮</label>
  </div>

  <label for="apiKey">DeepSeek API Key</label>
  <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" />
  <div class="hint">在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com</a> 申请。Key 只保存在本地浏览器中，只会发往 api.deepseek.com。</div>

  <label for="targetLang">输出语言</label>
  <select id="targetLang">
    <option value="简体中文">简体中文</option>
    <option value="繁體中文">繁體中文</option>
    <option value="English">English</option>
    <option value="日本語">日本語</option>
    <option value="한국어">한국어</option>
    <option value="__custom__">自定义…</option>
  </select>
  <input type="text" id="targetLangCustom" placeholder="例如：法语" style="margin-top:6px; display:none;" />

  <h2>翻译按钮</h2>
  <div class="row">
    <input type="checkbox" id="showTranslate" />
    <label for="showTranslate">显示「DeepSeek 翻译」按钮</label>
  </div>
  <label for="translateModel">翻译使用的模型</label>
  <input type="text" id="translateModel" list="modelSuggestions" placeholder="deepseek-flash" autocomplete="off" spellcheck="false" />
  <div class="hint">直接填 DeepSeek 的模型名，例如 <code>deepseek-flash</code>（快、便宜）或 <code>deepseek-v4-pro</code>（更强）。</div>

  <h2>解释按钮</h2>
  <div class="row">
    <input type="checkbox" id="showExplain" />
    <label for="showExplain">显示「DeepSeek 解释」按钮</label>
  </div>
  <label for="explainModel">解释使用的模型</label>
  <input type="text" id="explainModel" list="modelSuggestions" placeholder="deepseek-v4-pro" autocomplete="off" spellcheck="false" />
  <div class="hint">解释需要理解背景，默认用更强的 <code>deepseek-v4-pro</code>；想省钱可以改成 <code>deepseek-flash</code>。</div>

  <datalist id="modelSuggestions">
    <option value="deepseek-flash"></option>
    <option value="deepseek-v4-pro"></option>
  </datalist>

  <div class="actions">
    <button id="save">保存</button>
    <button id="test">测试连接</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
